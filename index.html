<body>

<div class="container">
  <div class="card">

    <h1>Castbox URL Replacer</h1>

      Paste Castbox episode URLs below. The tool will remove the episode title

Example:
https://castbox.fm/episode/Pinocchio%3A-Unstrung-(2026)-Vietsub---Thuy%E1%BA%BFt-Minh-id7430510-id1004812500
https://castbox.fm/episode/[Phim-M%E1%BB%9Bi]-%E9%99%A4%E6%9A%B4%E4%B9%8B%E8%B7%AF-(2026)-Vietsub-id7430510-id1004812499"></textarea>

        Convert URLs

      </div>

    Castbox URL Replacer — Client-side tool
  </div>

<script>
"use strict";

/*
=========================================================
CASTBOX URL REPLACER
=========================================================

Input:
https://castbox.fm/episode/ANY-TITLE-id7430510-id1004812500

Output:
https://castbox.fm/episode/id7430510-id1004812500

The tool extracts:
idCHANNEL-idEPISODE

Example:
id7430510-id1004812500
=========================================================
*/

function extractCastboxId(value) {

  if (!value) {
    return null;
  }

  value = value.trim();

  /*
   * Main pattern:
   * id + digits + -id + digits
   *
   * Example:
   * id7430510-id1004812500
   */

  const match = value.match(/(id\d+-id\d+)(?:[/?#]|$)/i);

  if (match) {
    return match[1];
  }

  /*
   * Fallback:
   * If the URL has extra characters after the episode ID,
   * still extract the ID pair.
   */

  const fallback = value.match(/(id\d+-id\d+)/i);

  if (fallback) {
    return fallback[1];
  }

  return null;
}


function convertUrls() {

  const input = document.getElementById("inputUrls").value;

  const outputBox = document.getElementById("outputUrls");

  const inputCount = document.getElementById("inputCount");

  const successCount = document.getElementById("successCount");

  const errorCount = document.getElementById("errorCount");

  const status = document.getElementById("status");


  if (!input.trim()) {

    outputBox.value = "";

    inputCount.textContent = "0";
    successCount.textContent = "0";
    errorCount.textContent = "0";

    status.textContent = "No URLs entered.";

    return;
  }


  /*
   * Split by line.
   * Empty lines are ignored.
   */

  const lines = input
    .split(/\r?\n/)
    .map(line => line.trim())
    .filter(line => line.length > 0);


  const results = [];

  let success = 0;
  let errors = 0;


  lines.forEach(line => {

    const castboxId = extractCastboxId(line);

    if (castboxId) {

      results.push(
        "https://castbox.fm/episode/" + castboxId
      );

      success++;

    } else {

      /*
       * Invalid URLs are not included in output.
       */

      errors++;
    }

  });


  outputBox.value = results.join("\n");


  inputCount.textContent = lines.length;
  successCount.textContent = success;
  errorCount.textContent = errors;


  if (errors > 0) {

    status.textContent =
      "Converted " + success +
      " URL(s). " + errors +
      " invalid URL(s) were skipped.";

  } else {

    status.textContent =
      "Successfully converted " + success + " URL(s).";

  }
}


async function copyResults() {

  const outputBox = document.getElementById("outputUrls");

  const status = document.getElementById("status");

  if (!outputBox.value.trim()) {

    status.textContent =
      "Nothing to copy. Convert URLs first.";

    return;
  }


  try {

    await navigator.clipboard.writeText(
      outputBox.value
    );

    status.textContent =
      "Results copied to clipboard.";

  } catch (error) {

    /*
     * Fallback for browsers where Clipboard API
     * is unavailable.
     */

    outputBox.select();
    document.execCommand("copy");

    status.textContent =
      "Results copied to clipboard.";

  }
}


function downloadResults() {

  const output = document.getElementById("outputUrls").value;

  const status = document.getElementById("status");


  if (!output.trim()) {

    status.textContent =
      "Nothing to download. Convert URLs first.";

    return;
  }


  const blob = new Blob(
    [output],
    {
      type: "text/plain;charset=utf-8"
    }
  );


  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");

  a.href = url;

  a.download = "castbox-clean-urls.txt";

  document.body.appendChild(a);

  a.click();

  document.body.removeChild(a);

  URL.revokeObjectURL(url);


  status.textContent =
    "TXT file downloaded.";
}


function clearAll() {

  document.getElementById("inputUrls").value = "";

  document.getElementById("outputUrls").value = "";

  document.getElementById("inputCount").textContent = "0";

  document.getElementById("successCount").textContent = "0";

  document.getElementById("errorCount").textContent = "0";

  document.getElementById("status").textContent =
    "Ready.";
}


/*
=========================================================
OPTIONAL:
Allow Ctrl + Enter to convert
=========================================================
*/

document
  .getElementById("inputUrls")
  .addEventListener("keydown", function(event) {

    if (
      event.ctrlKey &&
      event.key === "Enter"
    ) {

      convertUrls();

    }

  });

</script>

</body>
</html>
